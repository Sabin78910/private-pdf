name: Android release (AAB)

# Builds the Play Store bundle. Signs it only when the KEYSTORE_* secrets exist
# (same upload-key setup as the other apps); otherwise the bundle is unsigned.
on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read

env:
  VITE_GOOGLE_CLIENT_ID: ${{ vars.GOOGLE_CLIENT_ID }}

jobs:
  aab:
    runs-on: ubuntu-latest
    env:
      CAN_PUBLISH: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON != '' && secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 22, cache: npm }
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: 21 }
      - run: npm ci
      - run: npm test
      - run: npm run build && npx cap sync android
      - name: Decode upload key
        env:
          KEYSTORE_BASE64: ${{ secrets.KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_BASE64" ]; then
            echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/upload.jks"
            echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"
          else
            echo "::notice::No KEYSTORE_BASE64 secret, so the AAB will be unsigned."
          fi
      - name: Build release bundle
        working-directory: android
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
          VERSION_CODE: ${{ github.run_number }}
        run: ./gradlew bundleRelease --no-daemon
      - uses: actions/upload-artifact@v4
        with:
          name: private-pdf-aab
          path: android/app/build/outputs/bundle/release/*.aab
      # Upload to Google Play internal testing. Runs only on pushes to main, and only when both the
      # upload key and the PLAY_SERVICE_ACCOUNT_JSON secret exist; otherwise it is skipped with a notice.
      # See docs/PLAY-RELEASE.md for the one-time service account setup.
      - name: Skip Play upload (secrets missing)
        if: env.CAN_PUBLISH != 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        run: echo "::notice::Play upload skipped. Add PLAY_SERVICE_ACCOUNT_JSON and the KEYSTORE_* secrets to publish to internal testing."
      - name: Upload to Play internal testing
        id: play
        if: env.CAN_PUBLISH == 'true' && github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        continue-on-error: true
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.privatepdf.mobile
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: completed
      # An app that has never had a release rolled out is a "draft app", and Play only accepts
      # draft releases for it. Retry as a draft so the bundle still lands; roll it out once in
      # Play Console and later runs go straight to testers.
      - name: Upload to Play internal testing as a draft
        if: steps.play.outcome == 'failure'
        uses: r0adkll/upload-google-play@v1
        with:
          serviceAccountJsonPlainText: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
          packageName: app.privatepdf.mobile
          releaseFiles: android/app/build/outputs/bundle/release/*.aab
          track: internal
          status: draft
